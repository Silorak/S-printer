services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - SNMP_COMMUNITY=public
      - PHP_ERROR_REPORTING=E_ALL
      - PHP_DISPLAY_ERRORS=0
      - PHP_LOG_ERRORS=1
      - PHP_ERROR_LOG=/var/log/apache2/php_errors.log
      - DB_HOST=db
      - DB_NAME=sprinter
      - DB_USER=sprinter
      - DB_PASS=sprinter_password
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:10.6
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=sprinter
      - MYSQL_USER=sprinter
      - MYSQL_PASSWORD=sprinter_password
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data: