version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    environment:
      - SNMP_COMMUNITY=public
      - PHP_ERROR_REPORTING=E_ALL
      - PHP_DISPLAY_ERRORS=0
      - PHP_LOG_ERRORS=1
    restart: unless-stopped
