version: '3'
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    environment:
      - SNMP_COMMUNITY=public
      - PHP_ERROR_REPORTING=E_ALL
      - PHP_DISPLAY_ERRORS=0
      - PHP_LOG_ERRORS=1
      - PHP_ERROR_LOG=/var/log/apache2/php_errors.log
    restart: unless-stopped